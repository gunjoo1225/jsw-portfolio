<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정성운 | 선임 안전관리자 포트폴리오</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Malgun Gothic','맑은 고딕',sans-serif;
    background: #0d1f35;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }
  .wrap { text-align:center; padding:40px 20px; }
  h1 { font-size:2.8rem; font-weight:900; color:#fff; letter-spacing:0.1em; margin-bottom:8px; }
  h1 span { color:#f5a623; }
  .sub { color:#8eb8d8; font-size:1rem; letter-spacing:3px; margin-bottom:48px; }
  .cards { display:flex; gap:24px; justify-content:center; flex-wrap:wrap; }
  .card {
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:16px; padding:36px 40px; text-decoration:none; color:#fff;
    transition:all 0.25s; min-width:240px;
  }
  .card:hover { background:rgba(245,166,35,0.15); border-color:#f5a623; transform:translateY(-4px); }
  .card .ico  { font-size:2.5rem; margin-bottom:14px; }
  .card h2    { font-size:1.1rem; font-weight:800; margin-bottom:8px; }
  .card p     { font-size:0.82rem; color:#8eb8d8; line-height:1.7; }
  .card .badge {
    display:inline-block; background:#f5a623; color:#1a2e4a;
    font-size:0.68rem; font-weight:700; padding:3px 10px; border-radius:10px;
    margin-bottom:12px; letter-spacing:1px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>정 <span>성</span> 운</h1>
  <div class="sub">선임 안전관리자 · 산업안전기사</div>
  <div class="cards">
    <a href="portfolio.html" class="card">
      <div class="ico">🖥️</div>
      <div class="badge">스타일 A</div>
      <h2>상단 메뉴 · 자유 스크롤</h2>
      <p>전통적인 웹사이트 형태<br>위에서 아래로 스크롤</p>
    </a>
    <a href="portfolio2.html" class="card">
      <div class="ico">📱</div>
      <div class="badge">스타일 B</div>
      <h2>좌측 사이드바 · 페이지 스냅</h2>
      <p>한 페이지씩 넘기는 방식<br>프레젠테이션 형태</p>
    </a>
  </div>
</div>
</body>
</html>
